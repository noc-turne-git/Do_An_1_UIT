[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planning-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["travel-planning-shared==0.1.0", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "tzdata>=2024.1", "langgraph>=1.0,<2", "openai>=3.39,<3.40", "sqlalchemy>=2.0,<2.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = {find = {where = [".."], include = ["ai", "ai.agents*", "ai.orchestration*", "ai.planning*", "ai.schemas*", "ai.prompts*"]}}
package-dir = {"ai" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "tests"]
