name: Monorepo checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./shared -e './ai[test]' -e './backend[test]'
      - run: python -m shared.export_schemas && git diff --exit-code -- shared/schemas
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps ./shared ./ai ./backend --wheel-dir /tmp/travel-wheels
