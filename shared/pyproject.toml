[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planning-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "tzdata>=2024.1", "jsonschema>=4,<5"]

[tool.setuptools]
packages = ["shared"]
package-dir = {"shared" = "."}

[tool.setuptools.package-data]
shared = ["schemas/*.json", "samples/*.json"]
